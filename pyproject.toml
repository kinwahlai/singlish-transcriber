[project]
name = "singlish-transcriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "meralion-3-asr>=0.1.0",
    "pyannote-audio>=4.0.7",
    "torch>=2.9.1",
]

[project.scripts]
singlish-transcriber = "singlish_transcriber:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
